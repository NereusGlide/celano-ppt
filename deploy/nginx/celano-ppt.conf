# CELANO PPT Nginx 反向代理配置
# 用法：
#   1. 把 celano-ppt.conf 里的 example.com 换成你的域名
#   2. 首次签发证书前，先把本文件放到 /etc/nginx/conf.d/celano-ppt.conf，
#      用 certbot 的 nginx 插件签发并自动改写为 80 端口 + 443 监听
#   3. 腾讯云控制台安全组需放行 80/443（若用 3000 直连则改放开 3000，但不推荐）

upstream celano_ppt {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP：仅用于证书签发与跳转
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # 证书校验路径（certbot webroot 模式需要）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    # 证书路径由 certbot 写入；若手动配置请替换为实际路径
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 参考图与 Logo 上传体积较大；应用侧 MAX_IMAGE_BYTES 为 40MB，这里留出余量
    client_max_body_size 60m;
    client_body_timeout 120s;

    # 安全响应头（CSP 由应用侧 helmet 下发，这里只补传输层相关项）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass         http://celano_ppt;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # PPT 生成任务通过 SSE 推送进度，缓冲必须关闭，否则事件会被攒到任务结束才吐出
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 画布构建产物带内容哈希，可长期缓存
    location /infinite-canvas/ {
        proxy_pass       http://celano_ppt;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/celano-ppt.access.log;
    error_log  /var/log/nginx/celano-ppt.error.log;
}
