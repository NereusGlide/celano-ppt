# CELANO PPT Nginx 反向代理配置
#
# 单域名用法：
#   1. 把全文的 example.com 换成你的域名
#   2. 放入 /etc/nginx/conf.d/celano-ppt.conf 后签发证书：
#      certbot --nginx -d example.com -m ops@example.com
#
# 多域名共用一个应用（SAN 证书，推荐用于主站 + 应用入口）：
#   1. 把 server_name 改成你的多个域名，例如「yamuai.cn ai.celano.cn」
#   2. 一条命令签发同时覆盖全部域名的证书（-d 可重复）：
#      certbot --nginx -d yamuai.cn -d ai.celano.cn -m ops@example.com
#      证书只存放在第一个 -d 指定的目录下，后续续期由 certbot 自动处理
#   3. 前提：所有域名都已解析到本机；未解析会导致签发失败
#
# 注意：修改已有域名的 A 记录会直接中断该域名在旧服务器上的业务，
#      请先确认旧机器上的服务可以下线，或改用「旧服务器反代到新服务器」的过渡方案。

upstream celano_ppt {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP：仅用于证书签发与跳转
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # 证书校验路径（certbot webroot 模式需要）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com www.example.com;

    # 证书路径由 certbot 写入；若手动配置请替换为实际路径
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 参考图与 Logo 上传体积较大；应用侧 MAX_IMAGE_BYTES 为 40MB，这里留出余量
    client_max_body_size 60m;
    client_body_timeout 120s;

    # 安全响应头（CSP 由应用侧 helmet 下发，这里只补传输层相关项）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass         http://celano_ppt;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # PPT 生成任务通过 SSE 推送进度，缓冲必须关闭，否则事件会被攒到任务结束才吐出
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 画布构建产物带内容哈希，可长期缓存
    location /infinite-canvas/ {
        proxy_pass       http://celano_ppt;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/celano-ppt.access.log;
    error_log  /var/log/nginx/celano-ppt.error.log;
}
