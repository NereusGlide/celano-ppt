# CELANO PPT 生产 Nginx 配置（由 certbot 签发证书后手工部署）
# 域名：yamuai.cn / www.yamuai.cn / ai.celano.cn / bokun.ltd / www.bokun.ltd → 127.0.0.1:3000
# 证书：/etc/letsencrypt/live/yamuai.cn/（certbot 自动续期，SAN 覆盖五域名）

upstream celano_ppt {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP：仅用于证书续期与跳转
server {
    listen 80;
    listen [::]:80;
    server_name yamuai.cn www.yamuai.cn ai.celano.cn bokun.ltd www.bokun.ltd;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Debian 12 自带 nginx 1.22，http2 需写在 listen 指令上（1.25.1+ 才支持独立的 http2 on;）
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yamuai.cn www.yamuai.cn ai.celano.cn bokun.ltd www.bokun.ltd;

    ssl_certificate     /etc/letsencrypt/live/yamuai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yamuai.cn/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 参考图与 Logo 上传体积较大；应用侧 MAX_IMAGE_BYTES 为 40MB，这里留出余量
    client_max_body_size 120m;
    # 慢速/跨境/代理链路下大文件上传容易瞬时断流，放宽到 300s 避免误杀
    client_body_timeout 300s;

    # 安全响应头（CSP 由应用侧 helmet 下发，这里只补传输层相关项）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass         http://celano_ppt;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # PPT 生成任务通过 SSE 推送进度，缓冲必须关闭，否则事件会被攒到任务结束才吐出
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 画布构建产物带内容哈希，可长期缓存
    location /infinite-canvas/ {
        proxy_pass       http://celano_ppt;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/celano-ppt.access.log;
    error_log  /var/log/nginx/celano-ppt.error.log;
}
