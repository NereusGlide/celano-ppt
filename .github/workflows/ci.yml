name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 类型 / 规范 / 测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # postinstall 会安装无限画布子项目依赖；构建产物由 ensure-canvas 在 build 前兜底
      # 两份 lock 已含 Linux/Windows/macOS 的原生二进制条目，可直接 npm ci
      - run: npm ci

      # lint = tsc --noEmit + biome check。
      # TypeScript 7 与 typescript-eslint 不兼容（peer <6.1.0），故用 Biome 替代 ESLint；
      # noExplicitAny / noNonNullAssertion 为 warn（记账不阻断），error 级规则见 biome.json。
      - name: 类型与规范检查
        run: npm run lint

      - name: 单元测试
        run: npm run test:image

  windows:
    name: Windows 环境校验
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 校验两份 lock 在 Windows 上同样可以直接安装（含画布 postinstall）
      - run: npm ci
      - run: npm run lint

  build:
    name: 生产构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
